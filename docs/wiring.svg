<svg width="1060" height="620" viewBox="0 0 1060 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <rect width="1060" height="620" fill="#ffffff"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">DS18B20 複数センサー配線図(レベルシフト + デイジーチェーン)</text>

  <!-- ============ LAYER 1: 箱(背景図形) ============ -->
  <rect x="20" y="70" width="160" height="160" rx="10" fill="#2d3436" stroke="#111" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">M5GO</text>
  <text x="100" y="125" text-anchor="middle" font-size="12" fill="#ccc">(M5Stack Core)</text>

  <rect x="320" y="120" width="180" height="240" rx="10" fill="#0984e3" stroke="#111" stroke-width="1.5"/>
  <text x="410" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">レベルシフタ</text>
  <text x="410" y="163" text-anchor="middle" font-size="11" fill="#dfefff">(双方向オープンドレイン型)</text>

  <rect x="620" y="120" width="90" height="240" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="665" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DS18B20</text>
  <text x="665" y="163" text-anchor="middle" font-size="12" fill="#222">センサーA</text>

  <rect x="740" y="120" width="90" height="240" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="785" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DS18B20</text>
  <text x="785" y="163" text-anchor="middle" font-size="12" fill="#222">センサーB</text>

  <rect x="860" y="120" width="90" height="240" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="905" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DS18B20</text>
  <text x="905" y="163" text-anchor="middle" font-size="12" fill="#222">センサーC</text>

  <rect x="980" y="120" width="60" height="240" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="1010" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">D</text>

  <!-- ============ LAYER 2: 配線(すべての線を、箱を描いた後に描く) ============ -->
  <!-- M5GO -> レベルシフタ -->
  <line x1="180" y1="150" x2="330" y2="150" stroke="#e17055" stroke-width="2"/>
  <line x1="180" y1="175" x2="330" y2="175" stroke="#00b894" stroke-width="2"/>
  <line x1="180" y1="200" x2="330" y2="240" stroke="#636e72" stroke-width="2"/>
  <!-- Grove 5V は箱の下を迂回してB面のVCCBへ -->
  <polyline points="180,225 180,390 490,390 490,330" fill="none" stroke="#d63031" stroke-width="2"/>

  <!-- レベルシフタ内部の仕切り線 -->
  <line x1="410" y1="175" x2="410" y2="345" stroke="#dfefff" stroke-width="1"/>

  <!-- プルアップ抵抗の配線 -->
  <line x1="490" y1="150" x2="530" y2="150" stroke="#e17055" stroke-width="2"/>
  <line x1="560" y1="150" x2="560" y2="330" stroke="#e17055" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- レベルシフタ -> センサーA -->
  <line x1="560" y1="150" x2="635" y2="150" stroke="#e17055" stroke-width="2"/>
  <line x1="490" y1="240" x2="635" y2="240" stroke="#636e72" stroke-width="2"/>
  <line x1="490" y1="330" x2="635" y2="330" stroke="#d63031" stroke-width="2"/>

  <!-- センサー間のデイジーチェーン配線 -->
  <line x1="695" y1="150" x2="755" y2="150" stroke="#e17055" stroke-width="2"/>
  <line x1="695" y1="240" x2="755" y2="240" stroke="#636e72" stroke-width="2"/>
  <line x1="695" y1="330" x2="755" y2="330" stroke="#d63031" stroke-width="2"/>

  <line x1="815" y1="150" x2="875" y2="150" stroke="#e17055" stroke-width="2"/>
  <line x1="815" y1="240" x2="875" y2="240" stroke="#636e72" stroke-width="2"/>
  <line x1="815" y1="330" x2="875" y2="330" stroke="#d63031" stroke-width="2"/>

  <line x1="935" y1="150" x2="995" y2="150" stroke="#e17055" stroke-width="2"/>
  <line x1="935" y1="240" x2="995" y2="240" stroke="#636e72" stroke-width="2"/>
  <line x1="935" y1="330" x2="995" y2="330" stroke="#d63031" stroke-width="2"/>

  <!-- ============ LAYER 3: 点とラベル(常に最前面) ============ -->
  <!-- M5GO側 -->
  <circle cx="178" cy="150" r="4" fill="#e17055"/>
  <text x="190" y="154" font-size="12" fill="#222">GPIO26 (DQ)</text>

  <circle cx="178" cy="175" r="4" fill="#00b894"/>
  <text x="190" y="179" font-size="12" fill="#222">GPIO17 (3.3V)</text>

  <circle cx="178" cy="200" r="4" fill="#636e72"/>
  <text x="190" y="204" font-size="12" fill="#222">GND</text>

  <circle cx="178" cy="225" r="4" fill="#d63031"/>
  <text x="190" y="229" font-size="12" fill="#222">Grove 5V</text>

  <!-- レベルシフタ側 -->
  <text x="365" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">A面 (3.3V)</text>
  <text x="455" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">B面 (5V)</text>

  <circle cx="330" cy="150" r="4" fill="#e17055"/>
  <text x="340" y="153" font-size="11" fill="#fff">A0</text>
  <text x="410" y="153" text-anchor="middle" font-size="13" fill="#fff">→</text>

  <circle cx="330" cy="175" r="4" fill="#00b894"/>
  <text x="340" y="178" font-size="11" fill="#fff">VCCA</text>

  <circle cx="330" cy="240" r="4" fill="#636e72"/>
  <text x="340" y="243" font-size="11" fill="#fff">GNDA</text>

  <circle cx="490" cy="150" r="4" fill="#e17055"/>
  <text x="480" y="153" text-anchor="end" font-size="11" fill="#fff">B0</text>

  <circle cx="490" cy="330" r="4" fill="#d63031"/>
  <text x="480" y="333" text-anchor="end" font-size="11" fill="#fff">VCCB</text>

  <circle cx="490" cy="240" r="4" fill="#636e72"/>
  <text x="480" y="243" text-anchor="end" font-size="11" fill="#fff">GNDB</text>

  <!-- プルアップ抵抗 -->
  <rect x="530" y="140" width="30" height="20" fill="none" stroke="#e17055" stroke-width="2"/>
  <text x="545" y="130" text-anchor="middle" font-size="10" fill="#333">2.2〜4.7kΩ</text>
  <text x="570" y="250" font-size="10" fill="#333" transform="rotate(90 570 250)">VCCB(5V)へプルアップ</text>

  <!-- センサーA -->
  <circle cx="635" cy="150" r="4" fill="#e17055"/><text x="645" y="153" font-size="10" fill="#222">DQ</text>
  <circle cx="635" cy="240" r="4" fill="#636e72"/><text x="645" y="243" font-size="10" fill="#222">GND</text>
  <circle cx="635" cy="330" r="4" fill="#d63031"/><text x="645" y="333" font-size="10" fill="#222">VDD</text>
  <circle cx="695" cy="150" r="3" fill="#e17055"/>
  <circle cx="695" cy="240" r="3" fill="#636e72"/>
  <circle cx="695" cy="330" r="3" fill="#d63031"/>

  <!-- センサーB -->
  <circle cx="755" cy="150" r="3" fill="#e17055"/>
  <circle cx="755" cy="240" r="3" fill="#636e72"/>
  <circle cx="755" cy="330" r="3" fill="#d63031"/>
  <circle cx="815" cy="150" r="3" fill="#e17055"/>
  <circle cx="815" cy="240" r="3" fill="#636e72"/>
  <circle cx="815" cy="330" r="3" fill="#d63031"/>

  <!-- センサーC -->
  <circle cx="875" cy="150" r="3" fill="#e17055"/>
  <circle cx="875" cy="240" r="3" fill="#636e72"/>
  <circle cx="875" cy="330" r="3" fill="#d63031"/>
  <circle cx="935" cy="150" r="3" fill="#e17055"/>
  <circle cx="935" cy="240" r="3" fill="#636e72"/>
  <circle cx="935" cy="330" r="3" fill="#d63031"/>

  <!-- センサーD -->
  <circle cx="995" cy="150" r="3" fill="#e17055"/>
  <circle cx="995" cy="240" r="3" fill="#636e72"/>
  <circle cx="995" cy="330" r="3" fill="#d63031"/>

  <text x="830" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">↑ センサーを中継地点として一本道でつなぐ(デイジーチェーン)</text>
  <text x="830" y="420" text-anchor="middle" font-size="12" fill="#555">1点から複数方向へ分岐させる「スター配線」は避けること</text>

  <!-- Legend -->
  <g font-size="12" fill="#222">
    <line x1="30" y1="460" x2="60" y2="460" stroke="#e17055" stroke-width="3"/>
    <text x="70" y="464">DQ (データ線)</text>

    <line x1="30" y1="485" x2="60" y2="485" stroke="#d63031" stroke-width="3"/>
    <text x="70" y="489">電源 (5V / 3.3V)</text>

    <line x1="30" y1="510" x2="60" y2="510" stroke="#636e72" stroke-width="3"/>
    <text x="70" y="514">GND</text>
  </g>

  <text x="20" y="560" font-size="12" fill="#555">注記:</text>
  <text x="20" y="580" font-size="12" fill="#555">・GPIO17は起動時に machine.Pin(17, Pin.OUT); value(1) でHIGH固定し、レベルシフタVCCA用の3.3V電源として利用</text>
  <text x="20" y="598" font-size="12" fill="#555">・プルアップ抵抗(2.2〜4.7kΩ)はB面(5V側)のDQ線とVCCB間に1箇所だけ入れればよい</text>
</svg>
