<svg width="1060" height="675" viewBox="0 0 1060 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <rect width="1060" height="675" fill="#ffffff"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">DS18B20 複数センサー配線図(レベルシフト + デイジーチェーン)</text>
  <text x="20" y="50" font-size="11" fill="#777">行の並び(上から): GND / 3.3V制御 / DQ / 電源(5V,VDD)</text>
  <text x="20" y="66" font-size="11" fill="#777">※3.3V(A面VCCA用)の取り方の一例としてGPIO17を使用。3端子レギュレータやM5-Busの3V3ピンなど他の方法でも可</text>

  <!-- ============ LAYER 1: 箱(背景図形) ============ -->
  <rect x="20" y="100" width="160" height="280" rx="10" fill="#2d3436" stroke="#111" stroke-width="1.5"/>
  <text x="100" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">M5GO</text>
  <text x="100" y="141" text-anchor="middle" font-size="12" fill="#ccc">(M5Stack Core)</text>

  <rect x="320" y="100" width="180" height="280" rx="10" fill="#0984e3" stroke="#111" stroke-width="1.5"/>
  <text x="410" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">レベルシフタ</text>
  <text x="410" y="141" text-anchor="middle" font-size="11" fill="#dfefff">(双方向オープンドレイン型)</text>
  <text x="365" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">A面 (3.3V)</text>
  <text x="455" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">B面 (5V)</text>

  <rect x="620" y="100" width="90" height="280" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="665" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DS18B20</text>
  <text x="665" y="141" text-anchor="middle" font-size="12" fill="#222">センサーA</text>

  <rect x="740" y="100" width="90" height="280" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="785" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DS18B20</text>
  <text x="785" y="141" text-anchor="middle" font-size="12" fill="#222">センサーB</text>

  <rect x="860" y="100" width="90" height="280" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="905" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DS18B20</text>
  <text x="905" y="141" text-anchor="middle" font-size="12" fill="#222">センサーC</text>

  <rect x="980" y="100" width="60" height="280" rx="8" fill="#fdcb6e" stroke="#111" stroke-width="1.2"/>
  <text x="1010" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">D</text>

  <!-- ============ LAYER 2: 配線 ============ -->
  <!-- M5GO -> レベルシフタ -->
  <line x1="180" y1="190" x2="330" y2="190" stroke="#636e72" stroke-width="2"/> <!-- GND -->
  <line x1="180" y1="215" x2="330" y2="215" stroke="#00b894" stroke-width="2"/> <!-- 3.3V制御 -->
  <line x1="180" y1="275" x2="330" y2="275" stroke="#e17055" stroke-width="2"/> <!-- DQ -->
  <line x1="180" y1="345" x2="490" y2="345" stroke="#d63031" stroke-width="2"/> <!-- Grove5V -> VCCB -->

  <!-- レベルシフタ内部の仕切り線 -->
  <line x1="410" y1="178" x2="410" y2="355" stroke="#dfefff" stroke-width="1"/>

  <!-- プルアップ抵抗: DQバスとVCCBバスをそれぞれ連続させたまま、その間を抵抗で分岐接続する -->
  <line x1="490" y1="275" x2="635" y2="275" stroke="#e17055" stroke-width="2"/> <!-- DQバス(連続、抵抗を経由しない) -->
  <line x1="490" y1="345" x2="635" y2="345" stroke="#d63031" stroke-width="2"/> <!-- VDD/VCCBバス(連続) -->
  <line x1="580" y1="275" x2="580" y2="295" stroke="#e17055" stroke-width="2"/>
  <line x1="580" y1="325" x2="580" y2="345" stroke="#e17055" stroke-width="2"/>

  <!-- レベルシフタ -> センサーA (GNDのみ、DQ/VDDは上でバスとして描画済み) -->
  <line x1="490" y1="190" x2="635" y2="190" stroke="#636e72" stroke-width="2"/> <!-- GND -->

  <!-- センサー間のデイジーチェーン配線 -->
  <line x1="695" y1="190" x2="755" y2="190" stroke="#636e72" stroke-width="2"/>
  <line x1="695" y1="275" x2="755" y2="275" stroke="#e17055" stroke-width="2"/>
  <line x1="695" y1="345" x2="755" y2="345" stroke="#d63031" stroke-width="2"/>

  <line x1="815" y1="190" x2="875" y2="190" stroke="#636e72" stroke-width="2"/>
  <line x1="815" y1="275" x2="875" y2="275" stroke="#e17055" stroke-width="2"/>
  <line x1="815" y1="345" x2="875" y2="345" stroke="#d63031" stroke-width="2"/>

  <line x1="935" y1="190" x2="995" y2="190" stroke="#636e72" stroke-width="2"/>
  <line x1="935" y1="275" x2="995" y2="275" stroke="#e17055" stroke-width="2"/>
  <line x1="935" y1="345" x2="995" y2="345" stroke="#d63031" stroke-width="2"/>

  <!-- ============ LAYER 3: 点・結線マーク・ラベル(常に最前面) ============ -->
  <!-- M5GO側 -->
  <circle cx="178" cy="190" r="4" fill="#636e72"/>
  <text x="190" y="194" font-size="12" fill="#222">GND</text>

  <circle cx="178" cy="215" r="4" fill="#00b894"/>
  <text x="190" y="219" font-size="12" fill="#222">GPIO17 (3.3V, 例)</text>

  <circle cx="178" cy="275" r="4" fill="#e17055"/>
  <text x="190" y="279" font-size="12" fill="#222">GPIO26 (DQ)</text>

  <circle cx="178" cy="345" r="4" fill="#d63031"/>
  <text x="190" y="349" font-size="12" fill="#222">Grove 5V</text>

  <!-- レベルシフタ側ピン -->
  <circle cx="330" cy="190" r="4" fill="#636e72"/>
  <text x="340" y="194" font-size="11" fill="#fff">GNDA</text>

  <circle cx="330" cy="215" r="4" fill="#00b894"/>
  <text x="340" y="219" font-size="11" fill="#fff">VCCA</text>

  <circle cx="330" cy="275" r="4" fill="#e17055"/>
  <text x="340" y="279" font-size="11" fill="#fff">A0</text>
  <text x="410" y="279" text-anchor="middle" font-size="13" fill="#fff">→</text>

  <circle cx="490" cy="190" r="4" fill="#636e72"/>
  <text x="480" y="194" text-anchor="end" font-size="11" fill="#fff">GNDB</text>

  <circle cx="490" cy="275" r="4" fill="#e17055"/>
  <text x="480" y="279" text-anchor="end" font-size="11" fill="#fff">B0</text>

  <circle cx="490" cy="345" r="4" fill="#d63031"/>
  <text x="480" y="349" text-anchor="end" font-size="11" fill="#fff">VCCB</text>

  <!-- プルアップ抵抗本体(DQバスとVCCBバスを結ぶ縦の枝の途中に配置) -->
  <rect x="570" y="295" width="20" height="30" fill="none" stroke="#e17055" stroke-width="2"/>
  <text x="598" y="314" font-size="10" fill="#333">2.2〜4.7kΩ</text>
  <circle cx="580" cy="275" r="3.5" fill="#e17055"/>
  <circle cx="580" cy="345" r="3.5" fill="#e17055"/>

  <!-- センサーA -->
  <circle cx="635" cy="190" r="4" fill="#636e72"/><text x="645" y="194" font-size="10" fill="#222">GND</text>
  <circle cx="635" cy="275" r="4" fill="#e17055"/><text x="645" y="279" font-size="10" fill="#222">DQ</text>
  <circle cx="635" cy="345" r="4" fill="#d63031"/><text x="645" y="349" font-size="10" fill="#222">VDD</text>
  <circle cx="695" cy="190" r="3" fill="#636e72"/>
  <circle cx="695" cy="275" r="3" fill="#e17055"/>
  <circle cx="695" cy="345" r="3" fill="#d63031"/>

  <!-- センサーB -->
  <circle cx="755" cy="190" r="3" fill="#636e72"/>
  <circle cx="755" cy="275" r="3" fill="#e17055"/>
  <circle cx="755" cy="345" r="3" fill="#d63031"/>
  <circle cx="815" cy="190" r="3" fill="#636e72"/>
  <circle cx="815" cy="275" r="3" fill="#e17055"/>
  <circle cx="815" cy="345" r="3" fill="#d63031"/>

  <!-- センサーC -->
  <circle cx="875" cy="190" r="3" fill="#636e72"/>
  <circle cx="875" cy="275" r="3" fill="#e17055"/>
  <circle cx="875" cy="345" r="3" fill="#d63031"/>
  <circle cx="935" cy="190" r="3" fill="#636e72"/>
  <circle cx="935" cy="275" r="3" fill="#e17055"/>
  <circle cx="935" cy="345" r="3" fill="#d63031"/>

  <!-- センサーD -->
  <circle cx="995" cy="190" r="3" fill="#636e72"/>
  <circle cx="995" cy="275" r="3" fill="#e17055"/>
  <circle cx="995" cy="345" r="3" fill="#d63031"/>

  <text x="830" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">↑ センサーを中継地点として一本道でつなぐ(デイジーチェーン)</text>
  <text x="830" y="440" text-anchor="middle" font-size="12" fill="#555">1点から複数方向へ分岐させる「スター配線」は避けること</text>

  <!-- Legend -->
  <g font-size="12" fill="#222">
    <line x1="30" y1="480" x2="60" y2="480" stroke="#e17055" stroke-width="3"/>
    <text x="70" y="484">DQ (データ線)</text>

    <line x1="30" y1="505" x2="60" y2="505" stroke="#d63031" stroke-width="3"/>
    <text x="70" y="509">電源 (5V / 3.3V)</text>

    <line x1="30" y1="530" x2="60" y2="530" stroke="#636e72" stroke-width="3"/>
    <text x="70" y="534">GND</text>
  </g>

  <text x="20" y="590" font-size="12" fill="#555">注記:</text>
  <text x="20" y="610" font-size="12" fill="#555">・レベルシフタVCCA用の3.3Vは、この図ではGPIO17を machine.Pin(17, Pin.OUT); value(1) でHIGH固定して代用する例を示しています</text>
  <text x="20" y="628" font-size="12" fill="#555">  (ds18b20_multi.py自体はこの処理を含みません。3端子レギュレータやM5-Busの3V3ピンなど、他の3.3V供給方法でも構いません)</text>
  <text x="20" y="646" font-size="12" fill="#555">・プルアップ抵抗(2.2〜4.7kΩ)はB面(5V側)のDQ線(B0)とVCCB間に1箇所だけ入れればよい</text>
</svg>
